<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Acesso ao Portal HEIMDALL.">
    <title>Portal HEIMDALL</title>
    <link rel="icon" type="image/png" href="../icons/Heindall/heindall_gold.png">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel = "stylesheet" href = "../styles/login_style/loginscreen.css" type = "text/css" media = "screen"/> 
    <link rel="stylesheet" href="../styles/accessibility/accessibility.css?v=12">
    <script type="module" src="../classes/functions/loginfunctions.js"></script>   
    <script type="module" src="../scripts/accessibility.js?v=7"></script>
    
    <script src="../classes/global/vars.js"></script>
</head>
<body class="login-page">
    <canvas id="backgroundCanvas"></canvas>

    <main class="login-main" id="loginMain">
    <form class="login_container" id="loginContainer" novalidate>
        <div class="icon_container">
            <img id="logoMain" class="inside" src="../icons/Heindall/heindall_black.png" alt="HEIMDALL">
            <img class="inside icon_hover" src="../icons/Heindall/heindall_gold.png" alt="">
        </div>        

        <h1 class="title">Portal Heimdall</h1>
        <div class="login_type">
            <span>Login para <span id="userType" class="client">Cliente</span></span>
            <button class="page_corner" type="button" aria-label="Alternar entre login de cliente e funcionário" aria-describedby="loginTypeHint">
                <span class="arrow">⇄</span>
            </button>
        </div>
        <span class="sr-only" id="loginTypeHint">Alterna o tipo de acesso.</span>

        <label class="sr-only" for="email">E-mail ou usuário</label>
        <input type="text" placeholder="E-mail ou usuário" id="email" autocomplete="username" required>
        <div class="senha_container">
            <label class="sr-only" for="senha">Senha</label>
            <input type="password" placeholder="Senha" id="senha" autocomplete="current-password" required>
            <canvas id="eyeCanvas" width="40" height="40" role="button" tabindex="0" aria-label="Mostrar senha"></canvas>
        </div>

        <div class="inferior_line">
            <span class="error" id="errorMsg" role="alert" aria-live="assertive"></span>
            <a href="#" class="get_back">esqueceu a senha</a>
        </div>

        <button type="submit" class="login-submit">Entrar</button>
    </form>
    </main>
</body>
</html>
